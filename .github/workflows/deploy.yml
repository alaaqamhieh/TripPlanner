name: Deploy to GitHub Pages

# Builds the app and publishes dist/ to the gh-pages branch on every push.
# GitHub serves that branch automatically at:
#   https://alaaqamhieh.github.io/TripPlanner/

on:
  push:
    branches: [main, claude/trip-planner-questionnaire-l2figz]
  workflow_dispatch:

permissions:
  contents: write

# Only run one deploy at a time; newer pushes cancel older in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Both are optional — the app is fully functional without them.
          VITE_GOOGLE_PLACES_KEY: ${{ secrets.VITE_GOOGLE_PLACES_KEY }}
          VITE_FIREBASE_DB_URL: ${{ secrets.VITE_FIREBASE_DB_URL }}

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
